name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find submission
        run: |
          DIR=$(find submissions -name "validate_workflow.py" -path "*/n8n-weekly-dev-summary/*" | head -1 | xargs dirname)
          echo "Submission dir: $DIR"
          cd "$DIR"
          python validate_workflow.py
          echo "README lines: $(wc -l < README.md)"
          echo "Sample output lines: $(wc -l < sample-output.md)"
